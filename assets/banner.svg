<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a3a4a" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#2a1a3a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e85d75"/>
      <stop offset="35%" stop-color="#f5a623"/>
      <stop offset="65%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#7b68ee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <!-- particles -->
  <circle cx="80" cy="60" r="1.5" fill="#c44" opacity="0.5"/>
  <circle cx="150" cy="180" r="1" fill="#c44" opacity="0.3"/>
  <circle cx="300" cy="40" r="1.2" fill="#a55" opacity="0.4"/>
  <circle cx="420" cy="250" r="0.8" fill="#c44" opacity="0.25"/>
  <circle cx="550" cy="80" r="1" fill="#a55" opacity="0.3"/>
  <circle cx="700" cy="280" r="1.3" fill="#c44" opacity="0.35"/>
  <circle cx="850" cy="50" r="0.9" fill="#a55" opacity="0.4"/>
  <circle cx="980" cy="200" r="1.1" fill="#c44" opacity="0.3"/>
  <circle cx="1100" cy="70" r="1.4" fill="#c44" opacity="0.5"/>
  <circle cx="1200" cy="240" r="1" fill="#a55" opacity="0.3"/>
  <circle cx="640" cy="30" r="0.8" fill="#c44" opacity="0.2"/>
  <circle cx="380" cy="290" r="1.2" fill="#a55" opacity="0.25"/>
  <circle cx="900" cy="290" r="0.9" fill="#c44" opacity="0.3"/>
  <!-- AG UNLOCK CLIENT -->
  <text x="80" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#e0e0e0" letter-spacing="4">AG UNLOCK</text>
  <text x="80" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#e0e0e0" letter-spacing="4">CLIENT</text>
  <!-- divider -->
  <line x1="330" y1="100" x2="330" y2="220" stroke="#333" stroke-width="1"/>
  <!-- Antigravity logo shape -->
  <path d="M 380 200 C 380 160, 390 120, 405 120 C 420 120, 425 160, 425 200 C 425 210, 418 215, 405 215 C 392 215, 380 210, 380 200 Z" fill="url(#logo)" opacity="0.9"/>
  <!-- Google Antigravity text -->
  <text x="450" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="400" fill="#ffffff">Google Antigravity</text>
  <!-- right side tagline -->
  <text x="1050" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#c0c0c0">Antigravity работает.</text>
  <text x="1050" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#c0c0c0">Где угодно.</text>
  <!-- GitHub link -->
  <text x="440" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#888">⬤ Find it on GitHub: chelslava/ag-unlock-client</text>
</svg>
